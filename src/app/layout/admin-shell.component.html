<div class="min-h-[100dvh] bg-canvas">
  @if (mobileOpen()) {
    <button
      class="fixed inset-0 z-40 bg-nav/60 lg:hidden"
      type="button"
      aria-label="Close navigation"
      (click)="mobileOpen.set(false)"
    ></button>
  }

  <aside
    class="fixed inset-y-0 left-0 z-50 flex w-[248px] flex-col bg-nav text-white transition-transform duration-200 lg:translate-x-0"
    [class.-translate-x-full]="!mobileOpen()"
    [class.translate-x-0]="mobileOpen()"
  >
    <div class="flex h-20 items-center justify-between border-b border-white/10 px-6">
      <a class="group flex items-center gap-3" routerLink="/dashboard" (click)="mobileOpen.set(false)">
        <span class="grid h-9 w-9 place-items-center rounded-lg bg-kawama text-base font-black text-white">K</span>
        <span>
          <strong class="block text-[15px] font-black tracking-[0.14em]">KAWAMA</strong>
          <small class="mt-0.5 block text-[9px] font-bold tracking-[0.18em] text-slate-400">ADMINISTRATION</small>
        </span>
      </a>
      <button class="grid h-10 w-10 place-items-center rounded-lg text-xl text-slate-300 hover:bg-white/10 hover:text-white lg:hidden" type="button" aria-label="Close navigation" (click)="mobileOpen.set(false)">
        <i class="uil uil-times" aria-hidden="true"></i>
      </button>
    </div>

    <nav class="flex-1 px-3 py-6" aria-label="Administration">
      <p class="px-3 pb-3 text-[10px] font-bold uppercase tracking-[0.14em] text-slate-500">Workspace</p>
      @for (item of navigation; track item.path) {
        <a
          class="mb-1 flex min-h-11 items-center gap-3 rounded-lg px-3.5 text-sm font-bold text-slate-300 transition hover:bg-white/7 hover:text-white"
          [routerLink]="item.path"
          routerLinkActive="bg-white/10! text-white!"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="mobileOpen.set(false)"
        >
          <i class="uil text-lg leading-none" [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="border-t border-white/10 p-4">
      <p class="truncate px-2 text-xs font-semibold text-slate-400">{{ auth.admin()?.email }}</p>
      <button class="mt-3 flex w-full items-center gap-2 rounded-lg border border-white/15 px-3 py-2.5 text-left text-sm font-bold text-white transition hover:bg-white/8" type="button" (click)="signOut()">
        <i class="uil uil-signout text-lg leading-none" aria-hidden="true"></i>
        Sign out
      </button>
    </div>
  </aside>

  <div class="min-h-[100dvh] lg:pl-[248px]">
    <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-line bg-white/95 px-4 backdrop-blur-sm sm:px-6 lg:px-8">
      <button class="btn btn-secondary min-h-9 px-3 lg:hidden" type="button" (click)="mobileOpen.set(true)">
        <i class="uil uil-bars text-lg leading-none" aria-hidden="true"></i>
        Menu
      </button>
      <div class="hidden items-center gap-2 text-xs font-semibold text-muted lg:flex">
        <span>Kawama catalog</span>
        <span class="text-slate-300">/</span>
        <span class="text-ink">Owner workspace</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="hidden max-w-52 truncate text-xs font-semibold text-muted sm:block">{{ auth.admin()?.email }}</span>
        <span class="grid h-9 w-9 place-items-center rounded-lg bg-kawama-soft text-xl text-kawama" aria-hidden="true"><i class="uil uil-user"></i></span>
      </div>
    </header>

    <main class="mx-auto w-full max-w-[1500px] p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
