<div class="pointer-events-none fixed right-4 bottom-4 z-[100] grid w-[min(420px,calc(100%-2rem))] gap-2" aria-live="polite">
  @for (message of toast.messages(); track message.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-lg border bg-white px-4 py-3 shadow-[0_16px_48px_rgb(17_21_29/0.16)]"
      [class.border-emerald-300]="message.tone === 'success'"
      [class.border-red-300]="message.tone === 'error'"
      [class.border-line]="message.tone === 'info'"
      role="status"
    >
      <span
        class="mt-0.5 h-2.5 w-2.5 shrink-0 rounded-full"
        [class.bg-emerald-600]="message.tone === 'success'"
        [class.bg-red-700]="message.tone === 'error'"
        [class.bg-kawama]="message.tone === 'info'"
        aria-hidden="true"
      ></span>
      <p class="min-w-0 flex-1 text-sm leading-5 text-ink">{{ message.text }}</p>
      <button class="-m-1 rounded-md p-1 text-xs font-bold text-muted hover:bg-slate-100 hover:text-ink" type="button" (click)="toast.dismiss(message.id)" aria-label="Dismiss notification">Close</button>
    </div>
  }
</div>
